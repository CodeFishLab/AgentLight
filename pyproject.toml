[build-system]
# license = "Apache-2.0" 与 license-files 是 PEP 639 写法，需要 setuptools 77+
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlight"
version = "1.2.5"
description = "Windows tray controller for Orvyn Agent status lights"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["orvyn", "codex", "claude-code", "status-light", "usb-hid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities",
]
dependencies = [
  "aiohttp>=3.10,<4",
  "hidapi>=0.14,<1",
]

[project.scripts]
agentlightctl = "agentlight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
